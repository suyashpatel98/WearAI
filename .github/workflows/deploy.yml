# Keeps hosted in step with main (docs/spec/dev-ex.md#backend-deployed-automatically-on-merge).
# Runs after ci passes on a push to main that touched supabase/. Never sets secrets, never seeds.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosted
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      supabase: ${{ steps.diff.outputs.supabase }}
      sha: ${{ steps.diff.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: diff
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "supabase=true" >> "$GITHUB_OUTPUT"
          # Squash merges put one commit per PR on main, so its parent is the previous main.
          elif git diff --quiet "$sha~1" "$sha" -- supabase/; then
            echo "supabase=false" >> "$GITHUB_OUTPUT"
          else
            echo "supabase=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: mise run deploy:hosted
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_YES: "1"
